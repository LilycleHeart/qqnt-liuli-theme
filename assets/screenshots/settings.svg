<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2140"/><stop offset="1" stop-color="#4a2f52"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="brand2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b48bd8"/><stop offset="1" stop-color="#d98bc0"/>
    </linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="760" height="470" rx="14" fill="url(#wall2)"/>
  <circle cx="650" cy="60" r="130" fill="#ffffff" opacity="0.05"/>

  <!-- nav rail -->
  <rect x="14" y="14" width="190" height="442" rx="12" fill="url(#glass2)" filter="url(#soft2)"/>
  <rect x="28" y="34" width="100" height="11" rx="5" fill="#ffffff" opacity="0.8"/>
  <g opacity="0.55" fill="#ffffff">
    <rect x="28" y="70" width="120" height="8" rx="4"/>
    <rect x="28" y="98" width="100" height="8" rx="4"/>
  </g>
  <!-- active: 琉璃 -->
  <rect x="22" y="122" width="174" height="34" rx="9" fill="#ffffff" opacity="0.16"/>
  <circle cx="42" cy="139" r="8" fill="url(#brand2)"/>
  <text x="60" y="144" font-size="13" font-weight="700" fill="#ffffff">琉璃</text>
  <g opacity="0.55" fill="#ffffff">
    <rect x="28" y="176" width="110" height="8" rx="4"/>
    <rect x="28" y="204" width="92" height="8" rx="4"/>
  </g>

  <!-- settings panel -->
  <rect x="220" y="14" width="526" height="442" rx="12" fill="url(#glass2)" filter="url(#soft2)"/>
  <text x="244" y="48" font-size="16" font-weight="700" fill="#ffffff">琉璃 · 外观</text>
  <rect x="244" y="60" width="478" height="1" fill="#ffffff" opacity="0.12"/>

  <!-- row: slider -->
  <text x="244" y="92" font-size="13" fill="#f0eaf6">材质模糊</text>
  <rect x="470" y="86" width="252" height="6" rx="3" fill="#ffffff" opacity="0.18"/>
  <rect x="470" y="86" width="170" height="6" rx="3" fill="url(#brand2)"/>
  <circle cx="640" cy="89" r="9" fill="#ffffff"/>

  <text x="244" y="130" font-size="13" fill="#f0eaf6">透明度</text>
  <rect x="470" y="124" width="252" height="6" rx="3" fill="#ffffff" opacity="0.18"/>
  <rect x="470" y="124" width="120" height="6" rx="3" fill="url(#brand2)"/>
  <circle cx="590" cy="127" r="9" fill="#ffffff"/>

  <text x="244" y="168" font-size="13" fill="#f0eaf6">壁纸压暗</text>
  <rect x="470" y="162" width="252" height="6" rx="3" fill="#ffffff" opacity="0.18"/>
  <rect x="470" y="162" width="90" height="6" rx="3" fill="url(#brand2)"/>
  <circle cx="560" cy="165" r="9" fill="#ffffff"/>

  <!-- toggles -->
  <text x="244" y="212" font-size="13" fill="#f0eaf6">Markdown 渲染</text>
  <rect x="684" y="202" width="38" height="20" rx="10" fill="url(#brand2)"/>
  <circle cx="712" cy="212" r="8" fill="#fff"/>

  <text x="244" y="250" font-size="13" fill="#f0eaf6">消息入场动画</text>
  <rect x="684" y="240" width="38" height="20" rx="10" fill="url(#brand2)"/>
  <circle cx="712" cy="250" r="8" fill="#fff"/>

  <text x="244" y="288" font-size="13" fill="#f0eaf6">泛光</text>
  <rect x="684" y="278" width="38" height="20" rx="10" fill="#ffffff" opacity="0.22"/>
  <circle cx="694" cy="288" r="8" fill="#fff" opacity="0.8"/>

  <!-- font row -->
  <text x="244" y="330" font-size="13" fill="#f0eaf6">字体</text>
  <rect x="470" y="316" width="252" height="26" rx="8" fill="#ffffff" opacity="0.12"/>
  <text x="484" y="333" font-size="12" fill="#ffffff" opacity="0.9">Resource Han Rounded ▾</text>

  <!-- wallpaper picker -->
  <text x="244" y="374" font-size="13" fill="#f0eaf6">自定义壁纸</text>
  <rect x="470" y="360" width="120" height="48" rx="8" fill="url(#brand2)" opacity="0.5"/>
  <rect x="604" y="360" width="118" height="48" rx="8" fill="#ffffff" opacity="0.1" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <text x="620" y="389" font-size="12" fill="#ffffff" opacity="0.7">＋ 选图</text>

  <!-- mode -->
  <text x="244" y="432" font-size="13" fill="#f0eaf6">明暗模式</text>
  <rect x="470" y="420" width="90" height="24" rx="12" fill="#ffffff" opacity="0.12"/>
  <rect x="470" y="420" width="45" height="24" rx="12" fill="url(#brand2)"/>
  <text x="482" y="436" font-size="11" fill="#1b1326" font-weight="600">暗</text>
  <text x="528" y="436" font-size="11" fill="#ffffff" opacity="0.7">亮</text>

  <text x="244" y="462" font-size="10" fill="#ffffff" opacity="0.4" display="none">示意图</text>
</svg>
