<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2140"/>
      <stop offset="0.5" stop-color="#3a2a4e"/>
      <stop offset="1" stop-color="#4a2f52"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b48bd8"/>
      <stop offset="1" stop-color="#d98bc0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- wallpaper -->
  <rect width="760" height="470" rx="14" fill="url(#wall)"/>
  <circle cx="640" cy="80" r="140" fill="#ffffff" opacity="0.05"/>
  <circle cx="110" cy="420" r="120" fill="#ffffff" opacity="0.04"/>

  <!-- session list (left glass) -->
  <rect x="14" y="14" width="196" height="442" rx="12" fill="url(#glass)" filter="url(#soft)"/>
  <rect x="30" y="34" width="120" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
  <!-- active chat -->
  <rect x="24" y="62" width="176" height="56" rx="10" fill="#ffffff" opacity="0.16"/>
  <circle cx="52" cy="90" r="16" fill="url(#brand)"/>
  <rect x="78" y="80" width="86" height="9" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="78" y="96" width="110" height="7" rx="3" fill="#ffffff" opacity="0.5"/>
  <g opacity="0.7">
    <circle cx="52" cy="150" r="16" fill="#8d7fb0"/>
    <rect x="78" y="142" width="70" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="78" y="156" width="100" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
    <circle cx="52" cy="206" r="16" fill="#a07fb0"/>
    <rect x="78" y="198" width="80" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="78" y="212" width="92" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- chat pane -->
  <text x="236" y="42" fill="#ffffff" font-size="14" font-weight="600" opacity="0.95">派派国</text>
  <rect x="236" y="54" width="510" height="1" fill="#ffffff" opacity="0.12"/>

  <!-- msg 1 (other, cascade in) -->
  <g filter="url(#soft)">
    <rect x="236" y="74" width="300" height="60" rx="14" fill="url(#glass)"/>
  </g>
  <text x="252" y="94" font-size="12" font-weight="700" fill="#e5a6cf">小赤羽</text>
  <text x="252" y="114" font-size="12.5" fill="#f3eef8">今天的
    <tspan font-family="Consolas,monospace" fill="#ffd98b">config.json</tspan> 改好了吗？</text>
  <text x="252" y="126" font-size="11" fill="#cdbfe0">看一下 <tspan font-weight="700" fill="#ffffff">粗体</tspan> 和 <tspan text-decoration="line-through" fill="#b8a8cc">删除线</tspan></text>

  <!-- @ highlight bubble -->
  <g filter="url(#soft)">
    <rect x="236" y="146" width="330" height="46" rx="14" fill="url(#glass)"/>
  </g>
  <text x="252" y="166" font-size="12" font-weight="700" fill="#c79be0">月见</text>
  <rect x="252" y="174" width="40" height="15" rx="7" fill="#ff9d57" opacity="0.28"/>
  <text x="256" y="185" font-size="11.5" fill="#ffb877" font-weight="600">@你</text>
  <text x="298" y="185" font-size="12.5" fill="#f3eef8">来看一眼这条</text>

  <!-- own bubble (brand) -->
  <g filter="url(#soft)">
    <rect x="470" y="204" width="276" height="44" rx="14" fill="url(#brand)"/>
  </g>
  <text x="486" y="231" font-size="12.5" fill="#1b1326">已经推到仓库了 ✅</text>

  <!-- anti-recall restored -->
  <g filter="url(#soft)">
    <rect x="236" y="262" width="320" height="54" rx="14" fill="url(#glass)" stroke="#e5a6cf" stroke-dasharray="4 4" stroke-opacity="0.7"/>
  </g>
  <text x="252" y="282" font-size="12" font-weight="700" fill="#e5a6cf">小赤羽</text>
  <text x="252" y="300" font-size="12.5" fill="#f3eef8">这条消息被撤回了，但还看得到</text>
  <text x="252" y="312" font-size="10" fill="#e5a6cf" opacity="0.85">已撤回 · 小赤羽</text>

  <!-- input bar -->
  <rect x="236" y="402" width="510" height="44" rx="22" fill="url(#glass)" filter="url(#soft)"/>
  <text x="258" y="429" font-size="12.5" fill="#ffffff" opacity="0.5">输入消息…</text>
  <circle cx="716" cy="424" r="15" fill="url(#brand)"/>
  <path d="M710 424 l12 -5 -4 5 4 5 z" fill="#1b1326"/>

  <!-- caption -->
  <text x="236" y="462" font-size="10" fill="#ffffff" opacity="0.4">示意图 · 玻璃气泡 / @ 高亮 / Markdown / 名字分色 / 防撤回</text>
</svg>
